<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TidyTab</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="hero">
        <div class="brand">
          <img src="assets/tidytab-mark.svg" alt="" width="36" height="36">
          <div>
            <h1>TidyTab</h1>
            <p>AI tab control</p>
          </div>
        </div>
      </header>

      <section class="actions" aria-label="Actions">
        <p id="localAiWarning" class="local-ai-warning" hidden>Chrome Built-in AI runs inside this popup. Keep it open until sorting finishes.</p>
        <button id="sortButton" type="button">Sort current window</button>
        <button id="sleepButton" type="button" class="secondary">Sleep grouped tabs now</button>
        <div class="secondary-actions">
          <button id="undoButton" type="button" class="secondary">Undo</button>
          <button id="optionsButton" type="button" class="secondary">Options</button>
        </div>
      </section>

      <section id="status" class="status" role="status" aria-live="polite"></section>
      <section class="activity" aria-label="Status steps">
        <div class="activity-header">
          <h2>Status</h2>
          <button id="clearLogButton" type="button" class="link-button">Clear</button>
        </div>
        <ol id="activityLog" class="activity-log"></ol>
      </section>

      <div id="keepOpenModal" class="keep-open-modal" role="alertdialog" aria-labelledby="keepOpenTitle" aria-describedby="keepOpenText" hidden>
        <div class="keep-open-card">
          <div class="keep-open-spinner" aria-hidden="true"></div>
          <div>
            <h2 id="keepOpenTitle">Keep this popup open</h2>
            <p id="keepOpenText">Chrome Built-in AI is sorting locally. Closing this popup can stop the sort before it finishes.</p>
          </div>
        </div>
      </div>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
